version: 2

sources:
  - name: raw
    database: "{{ env_var('DBT_SOURCE_DATABASE') }}"
    schema: RAW

    tables:
      - name: customers
        columns:
          - name: customer_id
            data_tests:
              - not_null
              - unique

      - name: orders
        columns:
          - name: order_id
            data_tests:
              - not_null
              - unique

      - name: po_orders
        columns:
          - name: order_id
            data_tests:
              - not_null
              - unique